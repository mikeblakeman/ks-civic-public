          description: ''
  /api/v1/fiscal-notes/:
    get:
      operationId: v1_fiscal_notes_list
      description: |-
        Fiscal note PDFs.

        Filter by ``?bill_no=HB2001`` to find the fiscal note for a specific bill.
      parameters:
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: bill_no
        schema:
          type: string
        description: Canonical bill number, e.g. HB2001.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFiscalNoteList'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/PaginatedFiscalNoteList'
          description: ''
  /api/v1/fiscal-notes/{apn}/:
    get:
      operationId: v1_fiscal_notes_retrieve
      description: |-
        Fiscal note PDFs.

        Filter by ``?bill_no=HB2001`` to find the fiscal note for a specific bill.
      parameters:
      - in: path
        name: apn
        schema:
          type: string
          pattern: ^[^?]+$
        required: true
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      tags:
      - v1
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalNote'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/FiscalNote'
          description: ''
  /api/v1/general-orders/:
    get:
      operationId: v1_general_orders_retrieve
      description: |-
        Bills/resolutions on each chamber's General Orders calendar.

        Grouped by chamber (house/senate) then by general_orders subfolder
        (above_line, working_on, below_line). Each measure carries its
        GOORDERING position; lists are sorted by position. Reuses the same
        mirror query the public "Today" page uses, including the stale-move
        suppression that drops a measure moved out of a folder without a
        delete tombstone.
      summary: General orders calendar
      parameters:
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      tags:
      - v1
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralOrdersResponse'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/GeneralOrdersResponse'
          description: ''
  /api/v1/governor-actions/:
    get:
      operationId: v1_governor_actions_retrieve
      description: Bills classified by gubernatorial action.
      summary: Governor actions
      parameters:
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: 'Comma-separated subset of: signed, vetoed, veto-overridden,
          line-item-veto, partial-override, awaiting-governor.'
      tags:
      - Reference
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernorActionsEnvelope'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/GovernorActionsEnvelope'
          description: ''
  /api/v1/hearings/:
    get:
      operationId: v1_hearings_retrieve
      description: List committee hearings with chamber/committee/bill/date filters.
      summary: Committee hearings
      parameters:
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: bill
        schema:
          type: string
        description: Bill number, normalized form (HB2001)
      - in: query
        name: chamber
