openapi: 3.0.3
info:
  title: Kansas Legislature API
  version: '1'
  description: Read-only public API for Kansas legislative data.
  contact:
    name: Kansas Legislative Research Department
  license:
    name: Public domain (Kansas open records)
paths:
  /api/v1/:
    get:
      operationId: v1_retrieve
      description: List of every top-level API resource with its absolute URL.
      summary: API root
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      tags:
      - v1
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRootResponse'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/ApiRootResponse'
          description: ''
  /api/v1/appointments/:
    get:
      operationId: v1_appointments_list
      description: |-
        Inject ``?biennium=`` filtering into any viewset that has a
        ``biennium`` column. Falls back to ``settings.BIENNIUM``.
      parameters:
      - in: query
        name: appointing_authority
        schema:
          type: string
      - in: query
        name: apptno
        schema:
          type: integer
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
  /api/v1/appointments/{apptno}/:
    get:
      operationId: v1_appointments_retrieve
      description: Detail endpoint with appointment history from journal elements.
      parameters:
      - in: path
        name: apptno
        schema:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        required: true
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      tags:
      - v1
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/v1/biennia/:
    get:
      operationId: v1_biennia_retrieve
      description: Active and archived biennia served by this host.
      summary: Biennium directory
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      tags:
      - Reference
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
