        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: committee_type
        schema:
          type: string
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - v1
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommitteeList'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/PaginatedCommitteeList'
          description: ''
  /api/v1/committees/{kpid}/:
    get:
      operationId: v1_committees_retrieve
      description: Detail endpoint with resolved member names and in-committee bills.
      parameters:
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
