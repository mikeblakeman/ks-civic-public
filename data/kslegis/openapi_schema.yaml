            application/msgpack:
              schema:
                $ref: '#/components/schemas/BienniaResponse'
          description: ''
  /api/v1/bill_status/:
    get:
      operationId: v1_bill_status_retrieve
      description: 'Returns full per-bill status, history, and version metadata in
        the same shape as the v13 API on the legacy site. /api/v1/bill_status/<bill_no>/
        returns a single bill in {api_version, results: [...]}.'
      summary: Bill status (legacy v13 shape)
      parameters:
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      - in: query
        name: limit
        schema:
          type: integer
        description: Default 50, max 500. List endpoint only.
      - in: query
        name: offset
        schema:
          type: integer
        description: List endpoint only.
      tags:
      - Bills
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillStatusListEnvelope'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/BillStatusListEnvelope'
          description: ''
  /api/v1/bill_status/{bill_no}/:
    get:
      operationId: v1_bill_status_retrieve_2
      description: 'Returns full per-bill status, history, and version metadata in
        the same shape as the v13 API on the legacy site. /api/v1/bill_status/<bill_no>/
        returns a single bill in {api_version, results: [...]}.'
      summary: Bill status (legacy v13 shape)
      parameters:
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: path
        name: bill_no
        schema:
          type: string
        required: true
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      - in: query
        name: limit
        schema:
          type: integer
        description: Default 50, max 500. List endpoint only.
      - in: query
        name: offset
        schema:
          type: integer
        description: List endpoint only.
      tags:
      - Bills
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillStatusListEnvelope'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/BillStatusListEnvelope'
          description: ''
  /api/v1/chamber_status/:
    get:
      operationId: v1_chamber_status_retrieve
      description: Plain-string status of each chamber, derived from the most recent
