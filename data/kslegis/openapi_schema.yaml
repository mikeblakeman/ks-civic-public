  /api/v1/events/:
    get:
      operationId: v1_events_retrieve
      description: Journal-element actions for the most recent session day, optionally
        filtered by chamber or session day.
      summary: Session-day events
      parameters:
      - in: query
        name: biennium
        schema:
          type: string
        description: Two-year cycle, e.g. b2025_26. Defaults to the active biennium.
      - in: query
        name: chamber
        schema:
          type: string
        description: Filter to "house" or "senate".
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - msgpack
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size, max 500. Defaults to 500.
      - in: query
        name: offset
        schema:
          type: integer
        description: Pagination offset.
      - in: query
        name: session_day
        schema:
          type: string
        description: Session-day number (zero-padded internally).
      tags:
      - Live
      security:
      - ApiKeyAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
            application/msgpack:
              schema:
